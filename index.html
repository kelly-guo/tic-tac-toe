<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="headers">
    <h1>Tic Tac Toe</h1>
    </div>

    <div class="buttons">
    <input type="text" id="name1" placeholder="Player 1" class="player1-input">
    <input type="text" id="name2" placeholder="Player 2" class="player2-input">

    <button class="start-button">Start Game</button>
    <button class="restart-button">Restart Game</button>
    </div>


    <div class="gameboard">

        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>

        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>

        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>

    </div>

    <p class="status-msg"></p>

    <script src="script.js" defer></script>
    
</body>
</html>
